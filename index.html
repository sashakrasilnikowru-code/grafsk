<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>График смен</title>
    <style>
        :root {
            /* Light Theme Variables */
            --bg-color: #e6e6e6; /* Light gray instead of white */
            --text-color: #333;
            --panel-bg: rgba(230, 230, 230, 0.7);
            --panel-border: rgba(200, 200, 200, 0.4);
            --input-bg: rgba(230, 230, 230, 0.8);
            --input-border: #ccc;

            --btn-bg: #ec8854; /* Main orange/coral from palette */
            --btn-text: #e0e0e0; /* Light gray text instead of white */
            --btn-hover: #d37444;

            --shift-day-bg: rgba(255, 224, 160, 0.7);   /* #ffe0a0 */
            --shift-night-bg: rgba(255, 169, 110, 0.7);  /* #ffa96e */
            --shift-off-bg: rgba(93, 88, 75, 0.6);   /* #5d584b */
            --shift-vacation-bg: rgba(189, 221, 191, 0.7); /* #bdddbf */
            --shift-sick-bg: rgba(236, 136, 84, 0.7);    /* #ec8854 */

            --day-hover-bg: rgba(210, 210, 210, 0.9);
            --today-border: #ec8854;
            --neon-glow: 0 0 10px rgba(236, 136, 84, 0.6);

            --modal-overlay: rgba(0, 0, 0, 0.5);
        }

        [data-theme="dark"] {
            /* Dark Theme Variables */
            --bg-color: #1a1a1a;
            --text-color: #e0e0e0;
            --panel-bg: rgba(30, 30, 30, 0.7);
            --panel-border: rgba(150, 150, 150, 0.1);
            --input-bg: rgba(50, 50, 50, 0.8);
            --input-border: #555;

            --btn-bg: #d37444;
            --btn-hover: #b56035;

            --shift-day-bg: rgba(255, 224, 160, 0.5);
            --shift-night-bg: rgba(255, 169, 110, 0.5);
            --shift-off-bg: rgba(93, 88, 75, 0.6);
            --shift-vacation-bg: rgba(189, 221, 191, 0.5);
            --shift-sick-bg: rgba(236, 136, 84, 0.6);

            --day-hover-bg: rgba(70, 70, 70, 0.9);
            --today-border: #ec8854;
            --neon-glow: 0 0 12px rgba(236, 136, 84, 0.8);

            --modal-overlay: rgba(0, 0, 0, 0.7);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            transition: background-color 0.3s, color 0.3s;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
        }

        .bg-image {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            /* A generic beautiful background image for a desktop app feel */
            background-image: url('https://images.unsplash.com/photo-1506744626753-eda8151a1571?q=80&w=2070&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            z-index: -1;
            /* Blur effect */
            filter: blur(8px);
            transform: scale(1.05); /* Prevents blurred edges from showing the background */
        }

        .app-container {
            width: 90%;
            max-width: 1200px;
            margin: 20px auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 30px;
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            border-radius: 15px;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }

        .header-actions {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
        }

        .main-content {
            display: grid;
            grid-template-columns: 300px 1fr;
            gap: 20px;
        }

        @media (max-width: 900px) {
            .main-content {
                grid-template-columns: 1fr;
            }
        }

        .panel {
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            border-radius: 15px;
            padding: 20px;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }

        .controls {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        label {
            font-weight: 500;
            font-size: 0.9em;
        }

        input[type="number"], input[type="date"], select {
            padding: 10px;
            border: 1px solid var(--input-border);
            border-radius: 8px;
            background: var(--input-bg);
            color: var(--text-color);
            outline: none;
            transition: border-color 0.3s;
        }

        input[type="number"]:focus, input[type="date"]:focus, select:focus {
            border-color: var(--btn-bg);
            box-shadow: var(--neon-glow);
        }

        button {
            padding: 10px 15px;
            background-color: var(--btn-bg);
            color: var(--btn-text);
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: background-color 0.3s;
        }

        button:hover {
            background-color: var(--btn-hover);
            box-shadow: var(--neon-glow);
        }

        .secondary-btn {
            background-color: transparent;
            color: var(--text-color);
            border: 1px solid var(--btn-bg);
            margin-top: 5px;
        }

        .secondary-btn:hover {
            background-color: rgba(74, 144, 226, 0.2);
        }

        .cycle-step-row {
            display: flex;
            gap: 5px;
            margin-bottom: 5px;
            align-items: center;
        }

        .cycle-step-row select {
            flex: 2;
            padding: 8px;
        }

        .cycle-step-row input {
            flex: 1;
            padding: 8px;
            min-width: 50px;
        }

        .remove-step-btn {
            background-color: #ff4d4d;
            padding: 8px 12px;
            color: #e0e0e0;
            flex: 0;
        }

        .remove-step-btn:hover {
            background-color: #cc0000;
        }

        /* Toggle Switch */
        .theme-toggle {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 50px;
            height: 24px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #ccc;
            transition: .4s;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 16px;
            width: 16px;
            left: 4px;
            bottom: 4px;
            background-color: #e0e0e0;
            transition: .4s;
        }

        input:checked + .slider {
            background-color: var(--btn-bg);
        }

        input:checked + .slider:before {
            transform: translateX(26px);
        }

        .slider.round {
            border-radius: 24px;
        }

        .slider.round:before {
            border-radius: 50%;
        }

        /* Calendar */
        .calendar-section {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .calendar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .nav-btn {
            background: rgba(200,200,200,0.2);
            color: var(--text-color);
            border: 1px solid var(--panel-border);
            font-size: 1.2em;
            padding: 5px 15px;
        }

        .nav-btn:hover {
            background: var(--day-hover-bg);
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 5px;
        }

        .weekday {
            text-align: center;
            font-weight: bold;
            padding: 10px 0;
            border-bottom: 2px solid var(--panel-border);
        }

        .days-grid {
            grid-auto-rows: minmax(80px, auto);
        }

        .day-cell {
            border: 1px solid var(--panel-border);
            border-radius: 8px;
            padding: 5px;
            background: rgba(200,200,200,0.1);
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            display: flex;
            flex-direction: column;
        }

        .day-cell:hover {
            background: var(--day-hover-bg);
            transform: translateY(-2px);
            z-index: 1;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }

        .day-number {
            font-weight: bold;
            align-self: flex-end;
            margin-bottom: 5px;
        }

        .day-cell.today {
            border: 2px solid var(--today-border);
            box-shadow: var(--neon-glow);
        }

        .day-cell.other-month {
            opacity: 0.5;
        }

        .shift-info {
            font-size: 0.8em;
            text-align: center;
            margin-top: auto;
            padding: 2px;
            border-radius: 4px;
        }

        /* Shift Colors */
        .shift-day { background-color: var(--shift-day-bg); }
        .shift-night { background-color: var(--shift-night-bg); }
        .shift-off { background-color: var(--shift-off-bg); }
        .shift-vacation { background-color: var(--shift-vacation-bg); }
        .shift-sick { background-color: var(--shift-sick-bg); }

        /* Stats */
        .stats-row {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid var(--panel-border);
        }
        .stats-row:last-child { border-bottom: none; }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            z-index: 100;
            left: 0; top: 0;
            width: 100%; height: 100%;
            background-color: var(--modal-overlay);
            backdrop-filter: blur(5px);
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            width: 350px;
            position: relative;
        }

        .close-btn {
            position: absolute;
            top: 15px; right: 20px;
            font-size: 24px;
            cursor: pointer;
            color: var(--text-color);
        }

        .modal h2 { margin-bottom: 15px; }
        .modal-controls { margin-bottom: 15px; }
        .modal-actions { display: flex; justify-content: flex-end; }

        .collapsible-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.4s ease-out, margin-top 0.4s ease-out, opacity 0.4s ease-out;
            opacity: 0;
        }

        .collapsible-content.expanded {
            max-height: 1000px;
            opacity: 1;
            margin-top: 15px;
        }

        #toggle-builder-btn {
            width: 100%;
            margin-bottom: 5px;
        }
    </style>
</head>
<body>
    <div class="bg-image"></div>
    <div class="app-container">
        <header>
            <h1>График смен</h1>
            <div class="header-actions">
                <div class="theme-toggle">
                    <label for="theme-switch">Тёмная тема</label>
                    <label class="switch">
                        <input type="checkbox" id="theme-switch">
                        <span class="slider round"></span>
                    </label>
                </div>
                <button id="open-settings-btn" class="secondary-btn" style="margin-top:0; margin-left: 15px;">Настройки & Данные</button>
                <div class="auth-placeholders" id="auth-container" style="margin-left: 15px; display: flex; gap: 5px; align-items: center;">
                    <button class="secondary-btn auth-btn" style="margin-top:0;">Google</button>
                    <button class="secondary-btn auth-btn" style="margin-top:0;">GitHub</button>
                </div>
            </div>
        </header>

        <div class="main-content">
            <div class="left-sidebar" style="display: flex; flex-direction: column; gap: 20px;">
                <button id="toggle-builder-btn" class="secondary-btn panel" style="width: 100%; text-align: center; margin: 0; padding: 15px; font-size: 1.1em; background: var(--panel-bg); cursor: pointer;">
                    Создать шаблон смен &#9660;
                </button>

                <div id="cycle-builder-collapse" class="collapsible-content" style="margin-top: 0;">
                    <section class="controls panel">
                        <div class="control-group">
                            <label for="start-date">Дата начала цикла:</label>
                            <input type="date" id="start-date">
                        </div>
                        <div class="control-group">
                            <label>Последовательность цикла:</label>
                            <div id="cycle-steps-container">
                                <!-- Cycle steps will be rendered here -->
                            </div>
                            <button id="add-cycle-step-btn" type="button" class="secondary-btn">+ Добавить смену / выходной</button>
                        </div>
                        <div class="control-group">
                            <label for="default-hours">Часов в смене:</label>
                            <input type="number" id="default-hours" min="1" max="24" value="11">
                        </div>
                        <button id="generate-btn">Сгенерировать график на год</button>
                    </section>
                </div>

                <section class="stats panel">
                    <h2>Статистика</h2>
                    <div class="stats-row">
                        <span>Часов за текущий месяц:</span>
                        <strong id="month-hours">0</strong>
                    </div>
                    <div class="stats-row">
                        <span>Часов за текущий год:</span>
                        <strong id="year-hours">0</strong>
                    </div>
                </section>
            </div>

            <section class="calendar-section panel">
                <div class="calendar-header">
                    <button id="prev-month" class="nav-btn">&lt;</button>
                    <h2 id="current-month-year">Месяц Год</h2>
                    <button id="next-month" class="nav-btn">&gt;</button>
                </div>
                <div class="calendar-grid">
                    <div class="weekday">Пн</div>
                    <div class="weekday">Вт</div>
                    <div class="weekday">Ср</div>
                    <div class="weekday">Чт</div>
                    <div class="weekday">Пт</div>
                    <div class="weekday">Сб</div>
                    <div class="weekday">Вс</div>
                </div>
                <div id="calendar-days" class="calendar-grid days-grid"></div>
            </section>

        </div>
    </div>

    <!-- Modal for editing a specific day -->
    <div id="day-modal" class="modal">
        <div class="modal-content panel">
            <span class="close-btn">&times;</span>
            <h2 id="modal-date-title">Дата</h2>
            <div class="modal-controls">
                <label for="day-type">Тип дня:</label>
                <select id="day-type">
                    <option value="day">Дневная смена</option>
                    <option value="night">Ночная смена</option>
                    <option value="off">Выходной</option>
                    <option value="vacation">Отпуск</option>
                    <option value="sick">Больничный</option>
                    <option value="none">Очистить день</option>
                </select>
            </div>
            <div class="modal-controls" id="hours-control">
                <label for="custom-hours">Рабочие часы:</label>
                <input type="number" id="custom-hours" min="0" max="24">
            </div>
            <div class="modal-actions">
                <button id="save-day-btn" class="primary-btn">Сохранить</button>
            </div>
        </div>
    </div>

    <!-- Modal for Settings -->
    <div id="settings-modal" class="modal">
        <div class="modal-content panel" style="width: 400px;">
            <span class="close-btn" id="close-settings-btn">&times;</span>
            <h2>Настройки</h2>

            <div class="modal-controls">
                <h3>Цвета (Светлая тема)</h3>
                <div class="cycle-step-row">
                    <label style="flex:2">Дневная смена:</label>
                    <input type="color" id="color-day" value="#90ee90" style="flex:1">
                </div>
                <div class="cycle-step-row">
                    <label style="flex:2">Ночная смена:</label>
                    <input type="color" id="color-night" value="#2ecc71" style="flex:1">
                </div>
                <div class="cycle-step-row">
                    <label style="flex:2">Выходной:</label>
                    <input type="color" id="color-off" value="#d3d3d3" style="flex:1">
                </div>
            </div>

            <div class="modal-controls" style="margin-top: 20px; border-top: 1px solid var(--panel-border); padding-top: 20px;">
                <h3>Данные (Экспорт / Импорт)</h3>
                <p style="font-size: 0.8em; margin-bottom: 10px; color: var(--text-color);">Вы можете сохранить ваш график в файл и загрузить его на другом устройстве.</p>
                <div style="display: flex; gap: 10px;">
                    <button id="export-btn" style="flex:1">Экспорт (.json)</button>
                    <label class="secondary-btn" style="flex:1; text-align: center; cursor: pointer; display: flex; align-items: center; justify-content: center;">
                        Импорт
                        <input type="file" id="import-file" accept=".json" style="display: none;">
                    </label>
                </div>
            </div>

            <div class="modal-actions" style="margin-top: 20px;">
                <button id="reset-settings-btn" class="secondary-btn" style="margin-right: auto;">Сбросить цвета</button>
                <button id="save-settings-btn" class="primary-btn">Применить</button>
            </div>
        </div>
    </div>

    <!-- Supabase Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const supabaseUrl = 'https://oncgkinwhuyyposqexpc.supabase.co';
        const supabaseKey = 'sb_publishable_HTWPURunOy7vhPOBZ5ANEw_jYgDLKZR';
        const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

        // State
        let scheduleData = JSON.parse(localStorage.getItem('shiftSchedule')) || {};
        let currentDate = new Date();
        let selectedDateForModal = null;

        // Cycle Template State
        let cycleSteps = [
            { type: 'day', count: 1 },
            { type: 'night', count: 1 },
            { type: 'off', count: 2 }
        ];

        // Elements
        const themeSwitch = document.getElementById('theme-switch');
        const toggleBuilderBtn = document.getElementById('toggle-builder-btn');
        const cycleBuilderCollapse = document.getElementById('cycle-builder-collapse');
        const startDateInput = document.getElementById('start-date');
        const cycleStepsContainer = document.getElementById('cycle-steps-container');
        const addCycleStepBtn = document.getElementById('add-cycle-step-btn');
        const defaultHoursInput = document.getElementById('default-hours');
        const generateBtn = document.getElementById('generate-btn');

        const currentMonthYearEl = document.getElementById('current-month-year');
        const calendarDaysEl = document.getElementById('calendar-days');
        const prevMonthBtn = document.getElementById('prev-month');
        const nextMonthBtn = document.getElementById('next-month');

        const monthHoursEl = document.getElementById('month-hours');
        const yearHoursEl = document.getElementById('year-hours');

        const modal = document.getElementById('day-modal');
        const closeBtn = document.querySelector('.close-btn');
        const modalDateTitle = document.getElementById('modal-date-title');
        const dayTypeSelect = document.getElementById('day-type');
        const customHoursInput = document.getElementById('custom-hours');
        const saveDayBtn = document.getElementById('save-day-btn');
        const hoursControl = document.getElementById('hours-control');

        const settingsModal = document.getElementById('settings-modal');
        const openSettingsBtn = document.getElementById('open-settings-btn');
        const closeSettingsBtn = document.getElementById('close-settings-btn');
        const saveSettingsBtn = document.getElementById('save-settings-btn');
        const resetSettingsBtn = document.getElementById('reset-settings-btn');
        const colorDayInput = document.getElementById('color-day');
        const colorNightInput = document.getElementById('color-night');
        const colorOffInput = document.getElementById('color-off');
        const exportBtn = document.getElementById('export-btn');
        const importFile = document.getElementById('import-file');

        const authContainer = document.getElementById('auth-container');
        const authBtns = document.querySelectorAll('.auth-btn');

        // Initialization
        function init() {
            // Set initial start date to today if empty
            if (!startDateInput.value) {
                startDateInput.valueAsDate = new Date();
            }

            // Theme setup
            const savedTheme = localStorage.getItem('theme') || 'light';
            if (savedTheme === 'dark') {
                document.documentElement.setAttribute('data-theme', 'dark');
                themeSwitch.checked = true;
            }

            // Load custom colors
            const customColors = JSON.parse(localStorage.getItem('customColors'));
            if (customColors) {
                applyCustomColors(customColors);
            }

            renderCycleSteps();
            renderCalendar(currentDate);
            updateStats();
        }

        // Supabase Auth
        async function setLoggedInState(user) {
            const displayName = user.user_metadata?.full_name || user.email || 'Пользователь';

            authContainer.innerHTML = '';

            const nameSpan = document.createElement('span');
            nameSpan.style.fontWeight = 'bold';
            nameSpan.style.marginRight = '10px';
            nameSpan.textContent = `👤 ${displayName}`;

            const logoutBtn = document.createElement('button');
            logoutBtn.className = 'secondary-btn';
            logoutBtn.style.marginTop = '0';
            logoutBtn.textContent = 'Выйти';

            logoutBtn.addEventListener('click', async () => {
                await supabase.auth.signOut();
                location.reload();
            });

            authContainer.appendChild(nameSpan);
            authContainer.appendChild(logoutBtn);
        }

        authBtns.forEach(btn => {
            btn.addEventListener('click', async () => {
                const provider = btn.textContent.trim().toLowerCase(); // 'google' or 'github'
                const { data, error } = await supabase.auth.signInWithOAuth({
                    provider: provider,
                });
                if (error) {
                    console.error("Auth error:", error.message);
                    alert("Ошибка авторизации: " + error.message);
                }
            });
        });

        // Initialize Auth State Listener
        supabase.auth.onAuthStateChange((event, session) => {
            if (event === 'SIGNED_IN' && session) {
                setLoggedInState(session.user);
                loadDataFromSupabase();
            } else if (event === 'SIGNED_OUT') {
                localStorage.removeItem('authUser');
                scheduleData = {};
                localStorage.removeItem('shiftSchedule');
                renderCalendar(currentDate);
                updateStats();
            }
        });

        // Check initial session
        supabase.auth.getSession().then(({ data: { session } }) => {
            if (session) {
                setLoggedInState(session.user);
                loadDataFromSupabase();
            }
        });

        // Builder Collapse Toggle
        toggleBuilderBtn.addEventListener('click', () => {
            cycleBuilderCollapse.classList.toggle('expanded');
            if (cycleBuilderCollapse.classList.contains('expanded')) {
                toggleBuilderBtn.innerHTML = 'Скрыть шаблон смен &#9650;';
            } else {
                toggleBuilderBtn.innerHTML = 'Создать шаблон смен &#9660;';
            }
        });

        // Settings & Data Export/Import
        openSettingsBtn.addEventListener('click', () => {
            const customColors = JSON.parse(localStorage.getItem('customColors')) || { day: '#ffe0a0', night: '#ffa96e', off: '#5d584b' };
            colorDayInput.value = customColors.day;
            colorNightInput.value = customColors.night;
            colorOffInput.value = customColors.off;

            settingsModal.style.display = 'flex';
        });

        closeSettingsBtn.addEventListener('click', () => settingsModal.style.display = 'none');

        saveSettingsBtn.addEventListener('click', () => {
            const customColors = {
                day: colorDayInput.value,
                night: colorNightInput.value,
                off: colorOffInput.value
            };
            localStorage.setItem('customColors', JSON.stringify(customColors));
            applyCustomColors(customColors);
            settingsModal.style.display = 'none';
        });

        resetSettingsBtn.addEventListener('click', () => {
            localStorage.removeItem('customColors');
            document.documentElement.style.removeProperty('--shift-day-bg');
            document.documentElement.style.removeProperty('--shift-night-bg');
            document.documentElement.style.removeProperty('--shift-off-bg');
            colorDayInput.value = '#ffe0a0';
            colorNightInput.value = '#ffa96e';
            colorOffInput.value = '#5d584b';
        });

        function applyCustomColors(colors) {
            document.documentElement.style.setProperty('--shift-day-bg', colors.day + 'b3');
            document.documentElement.style.setProperty('--shift-night-bg', colors.night + 'b3');
            document.documentElement.style.setProperty('--shift-off-bg', colors.off + '99');
        }

        exportBtn.addEventListener('click', () => {
            const dataStr = JSON.stringify(scheduleData);
            const dataUri = 'data:application/json;charset=utf-8,'+ encodeURIComponent(dataStr);
            const exportFileDefaultName = 'shift_schedule.json';
            const linkElement = document.createElement('a');
            linkElement.setAttribute('href', dataUri);
            linkElement.setAttribute('download', exportFileDefaultName);
            linkElement.click();
        });

        importFile.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    const importedData = JSON.parse(e.target.result);
                    scheduleData = importedData;
                    saveData();
                    renderCalendar(currentDate);
                    updateStats();
                    alert("График успешно импортирован!");
                    settingsModal.style.display = 'none';
                } catch (err) {
                    alert("Ошибка чтения файла данных.");
                }
            };
            reader.readAsText(file);
        });

        // Cycle Builder Logic
        function renderCycleSteps() {
            cycleStepsContainer.innerHTML = '';
            cycleSteps.forEach((step, index) => {
                const row = document.createElement('div');
                row.className = 'cycle-step-row';

                const select = document.createElement('select');
                const options = [
                    { value: 'day', text: 'В день' },
                    { value: 'night', text: 'В ночь' },
                    { value: 'off', text: 'Выходные' }
                ];
                options.forEach(opt => {
                    const optionElement = document.createElement('option');
                    optionElement.value = opt.value;
                    optionElement.textContent = opt.text;
                    if (step.type === opt.value) optionElement.selected = true;
                    select.appendChild(optionElement);
                });

                select.addEventListener('change', (e) => {
                    cycleSteps[index].type = e.target.value;
                });

                const countInput = document.createElement('input');
                countInput.type = 'number';
                countInput.min = '1';
                countInput.value = step.count;
                countInput.addEventListener('change', (e) => {
                    cycleSteps[index].count = Math.max(1, parseInt(e.target.value) || 1);
                    e.target.value = cycleSteps[index].count;
                });

                const removeBtn = document.createElement('button');
                removeBtn.className = 'remove-step-btn';
                removeBtn.innerHTML = '&times;';
                removeBtn.title = 'Удалить';
                removeBtn.type = 'button';
                removeBtn.addEventListener('click', () => {
                    cycleSteps.splice(index, 1);
                    renderCycleSteps();
                });

                row.appendChild(select);
                row.appendChild(countInput);
                row.appendChild(removeBtn);
                cycleStepsContainer.appendChild(row);
            });
        }

        addCycleStepBtn.addEventListener('click', () => {
            cycleSteps.push({ type: 'day', count: 1 });
            renderCycleSteps();
        });

        // Theme Toggle
        themeSwitch.addEventListener('change', (e) => {
            if (e.target.checked) {
                document.documentElement.setAttribute('data-theme', 'dark');
                localStorage.setItem('theme', 'dark');
            } else {
                document.documentElement.setAttribute('data-theme', 'light');
                localStorage.setItem('theme', 'light');
            }
        });

        // Date formatting utility (YYYY-MM-DD local)
        function formatDate(date) {
            const d = new Date(date);
            const month = '' + (d.getMonth() + 1);
            const day = '' + d.getDate();
            const year = d.getFullYear();
            return [year, month.padStart(2, '0'), day.padStart(2, '0')].join('-');
        }

        // Generate Schedule
        generateBtn.addEventListener('click', () => {
            const startDateStr = startDateInput.value;
            if (!startDateStr) {
                alert("Пожалуйста, выберите дату начала цикла.");
                return;
            }

            const startDate = new Date(startDateStr);
            const defaultHours = parseInt(defaultHoursInput.value) || 11;

            const pattern = [];
            for (const step of cycleSteps) {
                for (let i = 0; i < step.count; i++) {
                    pattern.push({
                        type: step.type,
                        hours: step.type === 'off' ? 0 : defaultHours
                    });
                }
            }

            if (pattern.length === 0) {
                alert("Шаблон цикла пуст. Добавьте хотя бы одну смену или выходной.");
                return;
            }

            // Confirm overwrite
            if (Object.keys(scheduleData).length > 0) {
                if (!confirm("Это перезапишет существующий график на год вперед и на год назад начиная с выбранной даты. Продолжить?")) {
                    return;
                }
            }

            // Generate for 1 year FORWARD from start date
            let currentGenDate = new Date(startDate);
            const endDate = new Date(startDate);
            endDate.setFullYear(endDate.getFullYear() + 1);

            let patternIndex = 0;
            while (currentGenDate <= endDate) {
                const dateKey = formatDate(currentGenDate);
                const shift = pattern[patternIndex];
                scheduleData[dateKey] = { type: shift.type, hours: shift.hours };

                patternIndex = (patternIndex + 1) % pattern.length;
                currentGenDate.setDate(currentGenDate.getDate() + 1);
            }

            // Generate for 1 year BACKWARD from start date
            currentGenDate = new Date(startDate);
            currentGenDate.setDate(currentGenDate.getDate() - 1); // Start from day before
            const startDateBackward = new Date(startDate);
            startDateBackward.setFullYear(startDateBackward.getFullYear() - 1);

            // Pattern runs backwards
            patternIndex = pattern.length - 1;
            while (currentGenDate >= startDateBackward) {
                const dateKey = formatDate(currentGenDate);
                const shift = pattern[patternIndex];
                scheduleData[dateKey] = { type: shift.type, hours: shift.hours };

                patternIndex = (patternIndex - 1 + pattern.length) % pattern.length;
                currentGenDate.setDate(currentGenDate.getDate() - 1);
            }

            saveData();
            renderCalendar(currentDate);
            updateStats();

            // Collapse the builder after generation
            cycleBuilderCollapse.classList.remove('expanded');
            toggleBuilderBtn.innerHTML = 'Создать шаблон смен &#9660;';

            alert("График успешно сгенерирован!");
        });

        // Calendar Navigation
        prevMonthBtn.addEventListener('click', () => {
            currentDate.setDate(1); // Prevent month overflow on 31st
            currentDate.setMonth(currentDate.getMonth() - 1);
            renderCalendar(currentDate);
            updateStats();
        });

        nextMonthBtn.addEventListener('click', () => {
            currentDate.setDate(1);
            currentDate.setMonth(currentDate.getMonth() + 1);
            renderCalendar(currentDate);
            updateStats();
        });

        // Render Calendar
        function renderCalendar(date) {
            calendarDaysEl.innerHTML = '';

            const year = date.getFullYear();
            const month = date.getMonth();

            const monthNames = ["Январь", "Февраль", "Март", "Апрель", "Май", "Июнь", "Июль", "Август", "Сентябрь", "Октябрь", "Ноябрь", "Декабрь"];
            currentMonthYearEl.textContent = `${monthNames[month]} ${year}`;

            const firstDay = new Date(year, month, 1);
            const lastDay = new Date(year, month + 1, 0);

            // Adjust to make Monday the first day of the week (0 = Monday, ..., 6 = Sunday)
            let startDayOfWeek = firstDay.getDay() - 1;
            if (startDayOfWeek === -1) startDayOfWeek = 6;

            const todayStr = formatDate(new Date());

            // Previous month trailing days
            const prevMonthLastDay = new Date(year, month, 0).getDate();
            for (let i = startDayOfWeek - 1; i >= 0; i--) {
                const d = new Date(year, month - 1, prevMonthLastDay - i);
                createDayCell(d, true);
            }

            // Current month days
            for (let i = 1; i <= lastDay.getDate(); i++) {
                const d = new Date(year, month, i);
                createDayCell(d, false, formatDate(d) === todayStr);
            }

            // Next month leading days (fill up to 42 cells for 6 rows)
            const totalCellsRendered = startDayOfWeek + lastDay.getDate();
            const remainingCells = 42 - totalCellsRendered;
            for (let i = 1; i <= remainingCells; i++) {
                const d = new Date(year, month + 1, i);
                createDayCell(d, true);
            }
        }

        function createDayCell(date, isOtherMonth, isToday = false) {
            const cell = document.createElement('div');
            cell.className = 'day-cell';
            if (isOtherMonth) cell.classList.add('other-month');
            if (isToday) cell.classList.add('today');

            const dateStr = formatDate(date);
            const dayData = scheduleData[dateStr];

            const dayNum = document.createElement('div');
            dayNum.className = 'day-number';
            dayNum.textContent = date.getDate();
            cell.appendChild(dayNum);

            if (dayData) {
                cell.classList.add(`shift-${dayData.type}`);

                const shiftInfo = document.createElement('div');
                shiftInfo.className = 'shift-info';

                let text = '';
                switch(dayData.type) {
                    case 'day': text = `В день (${dayData.hours}ч)`; break;
                    case 'night': text = `В ночь (${dayData.hours}ч)`; break;
                    case 'off': text = 'Выходной'; break;
                    case 'vacation': text = 'Отпуск'; break;
                    case 'sick': text = 'Больничный'; break;
                }
                shiftInfo.textContent = text;
                cell.appendChild(shiftInfo);
            }

            cell.addEventListener('click', () => openModal(dateStr));
            calendarDaysEl.appendChild(cell);
        }

        // Modal Logic
        function openModal(dateStr) {
            selectedDateForModal = dateStr;
            const d = new Date(dateStr);
            modalDateTitle.textContent = d.toLocaleDateString('ru-RU');

            const currentData = scheduleData[dateStr] || { type: 'none', hours: parseInt(defaultHoursInput.value) || 11 };

            dayTypeSelect.value = currentData.type;
            customHoursInput.value = currentData.type === 'off' || currentData.type === 'vacation' || currentData.type === 'sick' || currentData.type === 'none' ? 0 : (currentData.hours || defaultHoursInput.value);

            toggleHoursVisibility();
            modal.style.display = 'flex';
        }

        function toggleHoursVisibility() {
            if (['off', 'vacation', 'sick', 'none'].includes(dayTypeSelect.value)) {
                hoursControl.style.display = 'none';
            } else {
                hoursControl.style.display = 'block';
            }
        }

        dayTypeSelect.addEventListener('change', () => {
            if (['day', 'night'].includes(dayTypeSelect.value)) {
                customHoursInput.value = customHoursInput.value == 0 ? defaultHoursInput.value : customHoursInput.value;
            }
            toggleHoursVisibility();
        });

        closeBtn.addEventListener('click', () => modal.style.display = 'none');
        window.addEventListener('click', (e) => {
            if (e.target === modal) modal.style.display = 'none';
            if (e.target === settingsModal) settingsModal.style.display = 'none';
        });

        saveDayBtn.addEventListener('click', () => {
            if (!selectedDateForModal) return;

            const type = dayTypeSelect.value;
            const hours = ['off', 'vacation', 'sick', 'none'].includes(type) ? 0 : (parseInt(customHoursInput.value) || 0);

            if (type === 'none') {
                delete scheduleData[selectedDateForModal];
            } else {
                scheduleData[selectedDateForModal] = { type, hours };
            }

            saveData();
            renderCalendar(currentDate);
            updateStats();
            modal.style.display = 'none';
        });

        // Data Management and Stats
        async function saveData() {
            localStorage.setItem('shiftSchedule', JSON.stringify(scheduleData));

            // Sync to Supabase if logged in
            const { data: { session } } = await supabase.auth.getSession();
            if (session && session.user) {
                const { error } = await supabase
                    .from('schedules')
                    .upsert({
                        user_id: session.user.id,
                        data: scheduleData
                    });

                if (error) {
                    console.error("Error syncing to Supabase:", error);
                }
            }
        }

        async function loadDataFromSupabase() {
            const { data: { session } } = await supabase.auth.getSession();
            if (session && session.user) {
                const { data, error } = await supabase
                    .from('schedules')
                    .select('data')
                    .eq('user_id', session.user.id)
                    .single();

                if (error && error.code !== 'PGRST116') { // PGRST116 is "Row not found", which is fine for new users
                    console.error("Error loading from Supabase:", error);
                } else if (data && data.data) {
                    scheduleData = data.data;
                    localStorage.setItem('shiftSchedule', JSON.stringify(scheduleData));
                    renderCalendar(currentDate);
                    updateStats();
                }
            }
        }

        function updateStats() {
            let monthHours = 0;
            let yearHours = 0;

            const currentYear = currentDate.getFullYear();
            const currentMonth = currentDate.getMonth(); // 0-11

            for (const [dateStr, data] of Object.entries(scheduleData)) {
                if (!data.hours || data.hours <= 0) continue;

                const parts = dateStr.split('-');
                if (parts.length === 3) {
                    const itemYear = parseInt(parts[0], 10);
                    const itemMonth = parseInt(parts[1], 10) - 1; // 0-indexed

                    if (itemYear === currentYear) {
                        yearHours += data.hours;
                        if (itemMonth === currentMonth) {
                            monthHours += data.hours;
                        }
                    }
                }
            }

            monthHoursEl.textContent = monthHours;
            yearHoursEl.textContent = yearHours;
        }

        // Run
        init();
    </script>
</body>
</html>
